name: Sync Upstream & Build

# 每周五 凌晨 3:00（北京时间 UTC+8）= 每周四 19:00 UTC
on:
  schedule:
    - cron: '0 19 * * 4'
  workflow_dispatch:
    inputs:
      force_build:
        description: "即使没有上游更新也强制构建一次"
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'

permissions:
  contents: write
  actions: write

concurrency:
  group: sync-upstream
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    env:
      UPSTREAM_REPO: https://github.com/tall-1997/daidai-flutter.git
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Add upstream remote and fetch
        run: |
          git remote remove upstream 2>/dev/null || true
          git remote add upstream "$UPSTREAM_REPO"
          git fetch upstream --prune --tags

      - name: Detect upstream branch and new commits
        id: check
        run: |
          UP_BRANCH=$(git symbolic-ref --short refs/remotes/upstream/HEAD 2>/dev/null || true)
          UP_BRANCH=${UP_BRANCH#upstream/}
          if [ -z "$UP_BRANCH" ]; then
            if git rev-parse --verify upstream/main >/dev/null 2>&1; then
              UP_BRANCH=main
            elif git rev-parse --verify upstream/master >/dev/null 2>&1; then
              UP_BRANCH=master
            else
              UP_BRANCH=main
            fi
          fi
          echo "upstream_branch=$UP_BRANCH" >> "$GITHUB_OUTPUT"

          NEW=$(git rev-list --count HEAD..upstream/$UP_BRANCH)
          echo "new_commits=$NEW" >> "$GITHUB_OUTPUT"
          echo "上游分支: $UP_BRANCH，待合入提交数: $NEW"

          UP_SHA=$(git rev-parse upstream/$UP_BRANCH)
          echo "upstream_sha=$UP_SHA" >> "$GITHUB_OUTPUT"

      - name: Merge upstream (保留本地修复)
        if: steps.check.outputs.new_commits != '0'
        run: |
          # -X ours：冲突时优先保留本仓库的修改（即 iOS 登录修复等补丁），
          # 未冲突的部分正常采用上游更新。
          if git merge --no-edit -X ours upstream/${{ steps.check.outputs.upstream_branch }}; then
            echo "MERGE_OK=1" >> "$GITHUB_ENV"
          else
            echo "合并出现无法自动解决的冲突，回滚并保持本仓库不变"
            git merge --abort || true
            echo "MERGE_OK=0" >> "$GITHUB_ENV"
            echo "::warning::上游合并发生冲突，已跳过本次同步，请手动处理"
            exit 1
          fi

      - name: Push merged result
        if: steps.check.outputs.new_commits != '0'
        run: |
          git push origin HEAD:main

      - name: Trigger iOS build
        if: steps.check.outputs.new_commits != '0' || inputs.force_build == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh workflow run ios-build.yml \
            --field package_mode=unsigned \
            --field export_method=development
          echo "已触发 iOS Build"

      - name: No upstream updates
        if: steps.check.outputs.new_commits == '0' && inputs.force_build != 'true'
        run: |
          echo "上游(upstream/${{ steps.check.outputs.upstream_branch }}) 没有新提交，跳过同步与构建。"
